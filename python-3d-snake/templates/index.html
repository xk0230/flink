<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 贪吃蛇</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        color: #eaf2ff;
        font-family: Arial, sans-serif;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.5;
      }

      #gameover {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        background: rgba(0, 0, 0, 0.55);
        font-size: 32px;
        font-weight: bold;
        text-align: center;
      }

      #tip {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        font-size: 14px;
        color: #c8d6f7;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>🎮 3D 贪吃蛇</div>
      <div>分数：<span id="score">0</span></div>
      <div>速度：<span id="speed">4</span> 格/秒</div>
    </div>
    <div id="tip">W/A/S/D 移动平面，Q/E 上下，R 重新开始</div>
    <div id="gameover">游戏结束<br />按 R 重新开始</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

      const GRID_SIZE = 12;
      const CELL_SIZE = 1;

      let speed = 4;
      let score = 0;
      let gameOver = false;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1020);

      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(17, 15, 17);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambient);

      const directional = new THREE.DirectionalLight(0xffffff, 1.2);
      directional.position.set(10, 20, 10);
      scene.add(directional);

      const half = (GRID_SIZE * CELL_SIZE) / 2;
      const gridHelper = new THREE.GridHelper(GRID_SIZE * CELL_SIZE, GRID_SIZE, 0x4e6ee0, 0x30407a);
      scene.add(gridHelper);

      const boxGeo = new THREE.BoxGeometry(CELL_SIZE * 0.92, CELL_SIZE * 0.92, CELL_SIZE * 0.92);
      const snakeMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 });
      const headMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
      const foodMat = new THREE.MeshStandardMaterial({ color: 0xff4d4f, emissive: 0x5c1112 });

      let snake = [
        { x: 0, y: 0, z: 0 },
        { x: -1, y: 0, z: 0 },
        { x: -2, y: 0, z: 0 }
      ];
      let direction = { x: 1, y: 0, z: 0 };
      let nextDirection = { ...direction };
      let food = randomFreeCell();

      let snakeMeshes = [];
      let foodMesh = new THREE.Mesh(boxGeo, foodMat);
      scene.add(foodMesh);

      function gridToWorld(v) {
        return (v + 0.5) * CELL_SIZE;
      }

      function centered(v) {
        return gridToWorld(v) - half;
      }

      function placeMesh(mesh, p) {
        mesh.position.set(centered(p.x), centered(p.y), centered(p.z));
      }

      function wrap(n) {
        if (n < 0) return GRID_SIZE - 1;
        if (n >= GRID_SIZE) return 0;
        return n;
      }

      function randomFreeCell() {
        while (true) {
          const p = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE),
            z: Math.floor(Math.random() * GRID_SIZE)
          };
          if (!snake.some((s) => s.x === p.x && s.y === p.y && s.z === p.z)) {
            return p;
          }
        }
      }

      function samePos(a, b) {
        return a.x === b.x && a.y === b.y && a.z === b.z;
      }

      function updateHUD() {
        document.getElementById('score').textContent = String(score);
        document.getElementById('speed').textContent = speed.toFixed(1);
      }

      function rebuildSnake() {
        snakeMeshes.forEach((m) => scene.remove(m));
        snakeMeshes = snake.map((seg, i) => {
          const mesh = new THREE.Mesh(boxGeo, i === 0 ? headMat : snakeMat);
          placeMesh(mesh, seg);
          scene.add(mesh);
          return mesh;
        });
      }

      function restart() {
        snake = [
          { x: 0, y: 0, z: 0 },
          { x: -1, y: 0, z: 0 },
          { x: -2, y: 0, z: 0 }
        ];
        direction = { x: 1, y: 0, z: 0 };
        nextDirection = { ...direction };
        speed = 4;
        score = 0;
        gameOver = false;
        food = randomFreeCell();
        placeMesh(foodMesh, food);
        updateHUD();
        rebuildSnake();
        document.getElementById('gameover').style.display = 'none';
      }

      function setDirection(newDir) {
        if (newDir.x === -direction.x && newDir.y === -direction.y && newDir.z === -direction.z) return;
        nextDirection = newDir;
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w') setDirection({ x: 0, y: 0, z: -1 });
        if (key === 's') setDirection({ x: 0, y: 0, z: 1 });
        if (key === 'a') setDirection({ x: -1, y: 0, z: 0 });
        if (key === 'd') setDirection({ x: 1, y: 0, z: 0 });
        if (key === 'q') setDirection({ x: 0, y: 1, z: 0 });
        if (key === 'e') setDirection({ x: 0, y: -1, z: 0 });
        if (key === 'r' && gameOver) restart();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let accum = 0;
      let last = performance.now();

      function tick(dt) {
        if (gameOver) return;
        accum += dt;
        const step = 1 / speed;
        while (accum >= step) {
          accum -= step;
          direction = { ...nextDirection };

          const head = snake[0];
          const newHead = {
            x: wrap(head.x + direction.x),
            y: wrap(head.y + direction.y),
            z: wrap(head.z + direction.z)
          };

          if (snake.some((seg) => samePos(seg, newHead))) {
            gameOver = true;
            document.getElementById('gameover').style.display = 'flex';
            return;
          }

          snake.unshift(newHead);

          if (samePos(newHead, food)) {
            score += 10;
            speed = Math.min(10, speed + 0.3);
            food = randomFreeCell();
            placeMesh(foodMesh, food);
            updateHUD();
          } else {
            snake.pop();
          }

          rebuildSnake();
        }
      }

      function animate(now) {
        const dt = (now - last) / 1000;
        last = now;
        tick(dt);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      placeMesh(foodMesh, food);
      updateHUD();
      rebuildSnake();
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
